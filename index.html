    <style>
      :root {
        color-scheme: light;
        --ink: #696969;
        --muted: #696969;
        --line: #eaded4;
        --panel: rgba(255, 251, 246, 0.96);
        --cream: #f8ead9;
        --cream-soft: #fff6ec;
        --pink: #efc3bc;
        --mint: #bfdade;
        --mint-strong: #8fb9c1;
        --blue: #bfdade;
        --apricot: #f5bd92;
        --apricot-strong: #e8a676;
        --location-lavender: #c9b7e8;
        --shadow: 0 8px 28px rgba(98, 79, 67, 0.13);
      }

      * {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
      }

      html,
      body,
      .app,
      #map {
        width: 100%;
        height: 100%;
      }

      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background: #f7f4ec;
      }

      button,
      input,
      select,
      textarea {
        font: inherit;
      }

      input,
      select,
      textarea {
        font-size: 16px;
      }

      button {
        cursor: pointer;
      }

      .app {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
      }

      #map {
        position: absolute;
        inset: 0;
        z-index: 0;
        background: #fbf2ea;
      }

      #map::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 420;
        pointer-events: none;
        background:
          linear-gradient(135deg, rgba(248, 234, 217, 0.16), rgba(239, 195, 188, 0.08) 45%, rgba(191, 218, 222, 0.08)),
          radial-gradient(circle at 18% 18%, rgba(255, 246, 236, 0.22), transparent 32%);
        mix-blend-mode: soft-light;
      }

      .topbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        width: 100%;
        display: grid;
        grid-template-columns: 46px 1fr 46px;
        grid-template-areas: ". brand menu";
        align-items: center;
        column-gap: 12px;
        z-index: 500;
        border: 0;
        border-bottom: 1px solid rgba(210, 199, 168, 0.54);
        border-radius: 0;
        background: var(--panel);
        box-shadow: 0 8px 20px rgba(98, 79, 67, 0.08);
        backdrop-filter: blur(16px);
        padding: max(8px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
      }

      .searchbox,
      .chip,
      .locate,
      .sheet {
        border: 1px solid rgba(210, 199, 168, 0.78);
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(16px);
      }

      .brand {
        grid-area: brand;
        height: 48px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0;
        font-size: 14px;
        font-weight: 900;
        white-space: nowrap;
        justify-self: center;
      }

      .brand-logo {
        width: 198px;
        height: 46px;
        object-fit: contain;
        display: block;
      }

      .searchbox {
        grid-area: search;
        position: absolute;
        top: calc(100% + 12px);
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: min(720px, calc(100% - 24px));
        height: 46px;
        border-radius: 999px;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        padding: 0 8px 0 15px;
        gap: 8px;
      }

      .searchbox span {
        color: var(--muted);
      }

      .searchbox input {
        width: 100%;
        border: 0;
        outline: 0;
        background: transparent;
        color: var(--ink);
        min-width: 0;
      }

      .clear {
        width: 30px;
        height: 30px;
        border: 0;
        border-radius: 50%;
        background: var(--cream-soft);
        color: var(--ink);
        display: grid;
        place-items: center;
      }

      .menu-button {
        grid-area: menu;
        width: 46px;
        height: 46px;
        border: 0;
        border-radius: 50%;
        background: transparent;
        display: grid;
        place-items: center;
        color: var(--ink);
      }

      .menu-button:hover,
      .menu-button:focus-visible {
        background: var(--cream-soft);
      }

      .menu-button svg {
        width: 22px;
        height: 22px;
        display: block;
      }

      .leaflet-popup-content-wrapper {
        border-radius: 16px;
        background: #fff;
        opacity: 1;
        box-shadow: 0 10px 28px rgba(98, 79, 67, 0.18);
      }

      .leaflet-popup-tip {
        background: #fff;
        opacity: 1;
      }

      .leaflet-popup-content {
        margin: 14px 42px 14px 16px;
        color: var(--ink);
        font-size: 13px;
        line-height: 1.55;
      }

      .leaflet-container a.leaflet-popup-close-button {
        top: 9px;
        right: 9px;
        width: 26px;
        height: 26px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: #fff;
        color: var(--ink);
        box-shadow: 0 4px 12px rgba(98, 79, 67, 0.12);
        display: grid;
        place-items: center;
        font-size: 18px;
        line-height: 24px;
        text-decoration: none;
      }

      .leaflet-container a.leaflet-popup-close-button:hover,
      .leaflet-container a.leaflet-popup-close-button:focus-visible {
        background: var(--cream-soft);
        color: var(--ink);
      }

      .station-map-pin {
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: #ef6f66;
        border: 3px solid #fff;
        box-shadow: 0 4px 12px rgba(116, 76, 72, 0.22);
        color: #fff;
        display: grid;
        place-items: center;
      }

      .station-map-pin svg {
        width: 14px;
        height: 14px;
        display: block;
      }

      .station-popup strong {
        display: inline-block;
        margin-bottom: 2px;
        font-size: 14px;
      }

      .modebar {
        position: absolute;
        top: calc(max(8px, env(safe-area-inset-top)) + 122px);
        left: 50%;
        transform: translateX(-50%);
        width: min(560px, calc(100% - 24px));
        z-index: 500;
        display: flex;
        gap: 8px;
        justify-content: center;
      }

      .chip {
        min-height: 38px;
        border-radius: 999px;
        color: var(--ink);
        padding: 0 14px;
        font-weight: 800;
      }

      .chip.active[data-filter="nursing"] {
        background: var(--mint);
        border-color: rgba(143, 185, 193, 0.9);
      }

      .chip.active[data-filter="diaper"] {
        background: var(--apricot);
        border-color: rgba(232, 166, 118, 0.88);
      }

      .chip.active[data-view="favorites"] {
        background: var(--cream);
        border-color: rgba(232, 166, 118, 0.72);
      }

      .menu-backdrop {
        position: fixed;
        inset: 0;
        z-index: 1200;
        background: rgba(105, 105, 105, 0.16);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease;
      }

      .menu-backdrop.open {
        opacity: 1;
        pointer-events: auto;
      }

      .side-menu {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        bottom: max(12px, env(safe-area-inset-bottom));
        right: 12px;
        z-index: 1300;
        width: min(360px, calc(100% - 24px));
        overflow: auto;
        overscroll-behavior: contain;
        border: 1px solid rgba(210, 199, 168, 0.78);
        border-radius: 20px;
        background: rgba(255, 251, 246, 0.98);
        box-shadow: 0 18px 52px rgba(98, 79, 67, 0.2);
        padding: 14px 14px max(26px, env(safe-area-inset-bottom));
        transform: translateY(-8px) scale(0.98);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.18s ease, transform 0.18s ease;
      }

      .side-menu.open {
        opacity: 1;
        pointer-events: auto;
        transform: translateY(0) scale(1);
      }

      .menu-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 2px 2px 12px;
      }

      .menu-head h2,
      .menu-section h3,
      .menu-subsection h4 {
        margin: 0;
        font-size: 15px;
      }

      .menu-subsection h4 {
        font-size: 13px;
      }

      .menu-close {
        width: 34px;
        height: 34px;
        border: 1px solid var(--line);
        border-radius: 50%;
        background: var(--cream-soft);
        color: var(--ink);
        font-size: 20px;
        line-height: 1;
      }

      .menu-section {
        border-top: 1px solid var(--line);
        padding: 13px 2px;
      }

      .menu-subsections {
        display: grid;
        gap: 14px;
        margin-top: 12px;
      }

      .menu-subsection {
        padding-left: 12px;
        border-left: 3px solid rgba(239, 195, 188, 0.65);
      }

      .profile-grid {
        display: grid;
        grid-template-columns: 88px 1fr;
        gap: 8px 10px;
        margin-top: 10px;
        font-size: 13px;
      }

      .profile-grid dt {
        color: var(--muted);
        font-weight: 800;
      }

      .profile-grid dd {
        margin: 0;
      }

      .profile-edit-form {
        display: grid;
        gap: 10px;
        margin-top: 12px;
      }

      .profile-edit-form[hidden] {
        display: none;
      }

      .profile-edit-form label {
        display: grid;
        gap: 6px;
        font-size: 12px;
        font-weight: 900;
      }

      .profile-edit-form input,
      .profile-edit-form select {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #fff;
        color: var(--ink);
        padding: 0 10px;
      }

      .profile-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .menu-favorites {
        display: grid;
        gap: 8px;
        margin-top: 10px;
      }

      .menu-favorite {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        color: var(--ink);
        padding: 10px;
        text-align: left;
      }

      .menu-favorite strong {
        display: block;
        font-size: 13px;
        line-height: 1.35;
      }

      .menu-favorite span {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.4;
      }

      .menu-empty,
      .menu-note {
        margin: 10px 0 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.6;
      }

      .menu-link {
        min-height: 38px;
        border-radius: 999px;
        padding: 0 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: var(--ink);
        background: #f8ead9;
        border: 1px solid var(--line);
        font-weight: 900;
        font-size: 12px;
      }


      .menu-action {
        min-height: 34px;
        border-radius: 999px;
        padding: 0 12px;
        border: 1px solid var(--line);
        background: var(--cream-soft);
        color: var(--ink);
        font-weight: 900;
        font-size: 12px;
      }

      .locate {
        position: absolute;
        right: 14px;
        top: 176px;
        z-index: 500;
        width: 46px;
        height: 46px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--ink);
        background: #fff;
        border-color: var(--ink);
      }

      .locate svg {
        width: 23px;
        height: 23px;
        display: block;
      }

      .locate:active {
        transform: scale(0.96);
      }

      .sheet {
        position: absolute;
        left: 50%;
        bottom: max(14px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        z-index: 500;
        width: min(700px, calc(100% - 24px));
        max-height: min(42vh, 380px);
        border-radius: 18px;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto 1fr;
        transition: max-height 0.2s ease;
      }

      .sheet.expanded {
        max-height: min(78vh, 720px);
      }

      .sheet-head {
        padding: 10px 14px 8px;
        border-bottom: 0;
        cursor: pointer;
        user-select: none;
      }

      .grabber {
        display: none;
      }

      .grabber::before {
        content: none;
      }

      .sheet-title {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
      }

      h1 {
        margin: 0;
        font-size: 16px;
        letter-spacing: 0;
      }

      .sheet-title p {
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }

      .results {
        overflow: auto;
        padding: 3px 0;
      }

      .place {
        width: 100%;
        border: 0;
        border-bottom: 1px solid rgba(232, 225, 208, 0.88);
        border-left: 5px solid transparent;
        background: transparent;
        padding: 12px 14px;
        text-align: left;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 12px;
        cursor: pointer;
        transition: background 0.16s ease, border-color 0.16s ease, box-shadow 0.16s ease;
      }

      .place.active {
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.74), 0 10px 22px rgba(137, 115, 97, 0.12);
      }

      .place.active[data-kind="nursing"] {
        background: rgba(191, 218, 222, 0.42);
        border-left-color: #8fb9c1;
      }

      .place.active[data-kind="diaper"] {
        background: rgba(245, 189, 146, 0.38);
        border-left-color: #e8a676;
      }

      .place.active .place-name {
        color: #5f5f5f;
      }

      .place-name {
        margin: 0;
        font-size: 15px;
        line-height: 1.35;
      }

      .distance {
        color: #8fb9c1;
        font-weight: 900;
        font-size: 13px;
      }

      .place-meta {
        grid-column: 1 / -1;
        margin: 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }

      .place-equipment {
        display: block;
        margin-top: 7px;
        color: #696969;
        font-weight: 800;
      }

      .place-actions {
        grid-column: 1 / -1;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .link {
        min-height: 32px;
        border-radius: 999px;
        padding: 0 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        color: var(--ink);
        background: #f8ead9;
        border: 1px solid var(--line);
        font-weight: 800;
        font-size: 12px;
      }

      .link.primary {
        background: #f9dddb;
        border-color: #efc3bc;
      }

      .favorite-button {
        min-height: 32px;
        border-radius: 999px;
        padding: 0 12px;
        border: 1px solid var(--line);
        background: #fff6ec;
        color: var(--ink);
        font-weight: 800;
        font-size: 12px;
      }

      .favorite-button.active {
        background: #efc3bc;
        border-color: #dda9a0;
      }

      .empty-state {
        padding: 24px 18px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        text-align: center;
      }

      .note {
        position: absolute;
        left: 14px;
        bottom: calc(max(14px, env(safe-area-inset-bottom)) + min(42vh, 380px) + 12px);
        z-index: 500;
        max-width: min(430px, calc(100% - 28px));
        padding: 8px 10px;
        border-radius: 13px;
        background: rgba(255, 255, 252, 0.88);
        border: 1px solid rgba(210, 199, 168, 0.75);
        color: var(--muted);
        font-size: 11px;
        line-height: 1.45;
        box-shadow: 0 6px 18px rgba(50, 45, 35, 0.1);
      }

      .note a {
        color: var(--ink);
        font-weight: 900;
      }

      .reset-data {
        position: absolute;
        right: 14px;
        bottom: calc(max(14px, env(safe-area-inset-bottom)) + min(42vh, 380px) + 12px);
        z-index: 500;
        min-height: 32px;
        border: 1px solid rgba(210, 199, 168, 0.75);
        border-radius: 999px;
        background: rgba(255, 251, 246, 0.9);
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        padding: 0 10px;
        box-shadow: 0 6px 18px rgba(50, 45, 35, 0.1);
      }

      .leaflet-pane,
      .leaflet-tile,
      .leaflet-marker-icon,
      .leaflet-marker-shadow,
      .leaflet-tile-container,
      .leaflet-pane > svg,
      .leaflet-pane > canvas,
      .leaflet-zoom-box,
      .leaflet-image-layer,
      .leaflet-layer {
        position: absolute;
        left: 0;
        top: 0;
      }

      .leaflet-container {
        overflow: hidden;
        font-family: inherit;
      }

      .leaflet-tile,
      .leaflet-marker-icon,
      .leaflet-marker-shadow {
        user-select: none;
        -webkit-user-drag: none;
      }

      .leaflet-tile-pane {
        filter: saturate(1.18) brightness(1.04) contrast(1.02);
      }

      .leaflet-control-zoom {
        display: none;
      }

      .leaflet-control-attribution {
        font-size: 10px;
      }

      .leaflet-popup-content-wrapper {
        border-radius: 14px;
        background: #fff;
        opacity: 1;
      }

      .entry {
        position: fixed;
        inset: 0;
        z-index: 2000;
        display: grid;
        place-items: center;
        padding: 20px;
        background:
          linear-gradient(135deg, rgba(239, 195, 188, 0.88), rgba(255, 246, 236, 0.72) 54%, rgba(248, 234, 217, 0.9)),
          radial-gradient(circle at 22% 18%, rgba(255, 232, 137, 0.42), transparent 32%),
          radial-gradient(circle at 82% 24%, rgba(245, 189, 146, 0.28), transparent 30%),
          radial-gradient(circle at 50% 88%, rgba(255, 246, 236, 0.7), transparent 34%);
      }

      .entry.hidden {
        display: none;
      }

      .entry-card {
        width: min(420px, 100%);
        border: 1px solid rgba(210, 199, 168, 0.78);
        border-radius: 24px;
        background: rgba(255, 251, 246, 0.94);
        box-shadow: 0 18px 48px rgba(98, 79, 67, 0.18);
        padding: 22px;
      }

      .entry-logo {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 14px;
      }

      .entry-logo img {
        width: min(340px, 100%);
        height: auto;
        display: block;
      }

      .entry-card h1 {
        margin: 0 0 8px;
        text-align: center;
        font-size: 20px;
      }

      .entry-card p {
        margin: 0 0 18px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
        text-align: center;
      }

      .entry-form {
        display: grid;
        gap: 12px;
      }

      .entry-field {
        display: grid;
        gap: 6px;
        font-size: 13px;
        font-weight: 800;
      }

      .entry-field input,
      .entry-field select {
        width: 100%;
        min-height: 44px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #fff;
        color: var(--ink);
        padding: 0 12px;
      }

      .entry-submit {
        min-height: 46px;
        margin-top: 4px;
        border: 1px solid #e8a676;
        border-radius: 999px;
        background: linear-gradient(135deg, #ffe889, #f5bd92);
        color: var(--ink);
        font-weight: 900;
      }

      .entry-note {
        margin-top: 12px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.5;
        text-align: center;
      }

      @media (max-width: 640px) {
        .app {
          min-height: 100dvh;
        }

        .topbar {
          top: 0;
          width: 100%;
          grid-template-columns: 44px 1fr 44px;
          grid-template-areas: ". brand menu";
          column-gap: 10px;
          border-radius: 0;
          padding: max(7px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 7px max(12px, env(safe-area-inset-left));
        }

        .brand {
          width: 100%;
          height: 44px;
          padding: 0;
          justify-self: center;
        }

        .brand-logo {
          width: 188px;
          height: 42px;
        }

        .searchbox {
          top: calc(100% + 10px);
          width: calc(100% - 16px);
          height: 42px;
          padding-left: 13px;
        }

        .menu-button {
          width: 42px;
          height: 42px;
        }

        .modebar {
          top: calc(max(7px, env(safe-area-inset-top)) + 110px);
          width: calc(100% - 16px);
          overflow-x: auto;
          justify-content: flex-start;
          padding: 0 2px;
        }

        .chip {
          flex: 0 0 auto;
          min-height: 34px;
          padding: 0 12px;
          font-size: 14px;
        }

        .locate {
          top: calc(max(7px, env(safe-area-inset-top)) + 156px);
          right: 8px;
          width: 42px;
          height: 42px;
        }

        .sheet {
          width: calc(100% - 16px);
          bottom: max(8px, env(safe-area-inset-bottom));
          max-height: min(40dvh, 340px);
          border-radius: 16px;
        }

        .sheet.expanded {
          max-height: min(76dvh, 680px);
        }

        .sheet-head {
          padding: 8px 12px 7px;
        }

        .place {
          padding: 10px 12px;
        }

        .place-name {
          font-size: 14px;
        }

        .entry {
          padding: 12px;
        }

        .entry-card {
          width: min(390px, 100%);
          max-height: calc(100dvh - 24px);
          overflow: auto;
          border-radius: 20px;
          padding: 18px;
        }

        .entry-logo img {
          width: min(270px, 100%);
        }

        .entry-card h1 {
          font-size: 18px;
        }

        .entry-card p {
          font-size: 12px;
        }

        .note {
          display: none;
        }

        .reset-data {
          display: none;
        }
      }
    </style>
  </head>

        <p>アカウント管理のために簡単な情報を入力してください。</p>

          <label class="entry-field">

            <input id="nickname" name="nickname" type="text" autocomplete="nickname" maxlength="20" required placeholder="例：ゆき" />
          </label>
          <label class="entry-field">
            年代

              <option value="">選択してください</option>
              <option value="10s">10代</option>
              <option value="20s">20代</option>
              <option value="30s">30代</option>
              <option value="40s">40代</option>
              <option value="50s">50代</option>
              <option value="60plus">60代以上</option>
              <option value="no_answer">回答しない</option>
            </select>
          </label>

            性別（任意）
            <select id="gender" name="gender">
              <option value="">選択しない</option>
              <option value="female">女性</option>
              <option value="male">男性</option>
              <option value="non_binary">その他</option>
              <option value="no_answer">回答しない</option>
            </select>
          </label>
          <button class="entry-submit" type="submit">地図を開く</button>

      document.querySelector("#locate").addEventListener("click", () => navigator.geolocation?.getCurrentPosition((pos) => { userLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude }; searchLocation = null; stationHighlight.remove(); searchMarker.remove(); document.querySelector("#search").value = ""; userMarker.setLatLng([userLocation.lat, userLocation.lng]); map.setView([userLocation.lat, userLocation.lng], 14); render(); }, () => { document.querySelector("#note").textContent = "現在地を取得できませんでした。テスト地点のまま表示します。"; }));
      const menuButton = document.querySelector("#menuButton");
      const menuBackdrop = document.querySelector("#menuBackdrop");
      const sideMenu = document.querySelector("#sideMenu");
      const sheet = document.querySelector(".sheet");
      const sheetHead = document.querySelector(".sheet-head");
      sheetHead.addEventListener("click", () => {
        sheet.classList.toggle("expanded");
      });
      function openMenu() { renderMenu(); menuBackdrop.hidden = false; sideMenu.hidden = false; requestAnimationFrame(() => { menuBackdrop.classList.add("open"); sideMenu.classList.add("open"); menuButton.setAttribute("aria-expanded", "true"); }); }
      function closeMenu() { menuBackdrop.classList.remove("open"); sideMenu.classList.remove("open"); menuButton.setAttribute("aria-expanded", "false"); setTimeout(() => { if (!sideMenu.classList.contains("open")) { menuBackdrop.hidden = true; sideMenu.hidden = true; } }, 190); }
      menuButton.addEventListener("click", openMenu);
      document.querySelector("#menuClose").addEventListener("click", closeMenu);
      menuBackdrop.addEventListener("click", closeMenu);
      document.addEventListener("keydown", (event) => { if (event.key === "Escape") closeMenu(); });
      document.querySelector("#editProfileButton").addEventListener("click", () => {
        fillProfileEditForm();
        document.querySelector("#profileEditForm").hidden = false;
      });
      document.querySelector("#cancelProfileEdit").addEventListener("click", () => {
        document.querySelector("#profileEditForm").hidden = true;
        fillProfileEditForm();
      });
      document.querySelector("#profileEditForm").addEventListener("submit", (event) => {
        event.preventDefault();
        const previousNickname = profileNickname();
        const profile = {
          ...currentProfile(),
          nickname: document.querySelector("#profileNicknameInput").value.trim(),
          ageRange: document.querySelector("#profileAgeRangeInput").value,
          gender: document.querySelector("#profileGenderInput").value,
          updatedAt: new Date().toISOString()
        };
        if (!profile.nickname || !profile.ageRange) return;
        saveProfile(profile, previousNickname);
        document.querySelector("#profileEditForm").hidden = true;
        render();
        renderMenu();
      });
      const entry = document.querySelector("#entry");
      const entryForm = document.querySelector("#entryForm");
      function resetSavedData() { if (!confirm("この端末に保存したプロフィールとお気に入りを削除しますか？")) return; Object.keys(localStorage).filter((key) => key === "babymapProfile" || key === "oyakoCareMapProfile" || key.startsWith("babymapFavorites:") || key.startsWith("oyakoCareMapFavorites:")).forEach((key) => localStorage.removeItem(key)); favoriteIds = new Set(); entry.classList.remove("hidden"); closeMenu(); render(); }
      document.querySelector("#resetData").addEventListener("click", resetSavedData);
      const savedProfile = localStorage.getItem("babymapProfile") || localStorage.getItem("oyakoCareMapProfile");
      loadFavorites();
      if (savedProfile) entry.classList.add("hidden");
      entryForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const profile = {
          nickname: document.querySelector("#nickname").value.trim(),
          ageRange: document.querySelector("#ageRange").value,
          gender: document.querySelector("#gender").value,
          savedAt: new Date().toISOString()
        };
        if (!profile.nickname || !profile.ageRange) return;
        saveProfile(profile);
        render();
        renderMenu();
        entry.classList.add("hidden");
      });
      render();
    </script>
  </body>
</html>
